<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الوسام المنصور</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with medal mark + horizontal tabs; one centered reading column (max 980px); cards only for interactive objects. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#56627a; --line:#d5dbe6;
  --brand:#14325c; --brand-ink:#ffffff; --medal:#b8862b; --medal-soft:#f6ecd4;
  --ok:#1b7f5a; --ok-soft:#dff3ea; --bad:#b3322f; --bad-soft:#f9e1df; --warn:#9a6b00; --warn-soft:#fbefc9;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1424; --surface:#14203a; --ink:#e8edf7; --muted:#9fb0cc; --line:#2a3a5c;
  --brand:#8fb4ee; --brand-ink:#0c1424; --medal:#e0b75a; --medal-soft:#33290f;
  --ok:#5fd0a0; --ok-soft:#10392b; --bad:#ff8f8a; --bad-soft:#401a19; --warn:#f0c25a; --warn-soft:#3a2d08; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1424; --surface:#14203a; --ink:#e8edf7; --muted:#9fb0cc; --line:#2a3a5c;
  --brand:#8fb4ee; --brand-ink:#0c1424; --medal:#e0b75a; --medal-soft:#33290f;
  --ok:#5fd0a0; --ok-soft:#10392b; --bad:#ff8f8a; --bad-soft:#401a19; --warn:#f0c25a; --warn-soft:#3a2d08; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.85;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:980px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.5;text-wrap:balance;margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--medal);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 0;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--f-display);font-size:1.45rem;color:var(--brand)}
.medal{width:34px;height:34px;flex:none}
.tools{display:flex;gap:8px;align-items:center}
.ibtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:.9rem}
nav{display:flex;gap:2px;overflow-x:auto;padding-block:8px 0;scrollbar-width:thin}
nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:8px 14px;border-bottom:3px solid transparent;font-weight:500;font-size:.95rem}
nav a[aria-current="page"]{color:var(--brand);border-color:var(--medal);font-weight:700}
main{padding-block:28px 60px;display:flex;flex-direction:column;gap:28px;min-width:0}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:28px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem)}
.hero p{margin:8px 0 0;opacity:.92;max-width:52ch}
.ring{width:120px;height:120px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.tile:hover{border-color:var(--medal)}
.tile h3{font-size:1.05rem;color:var(--brand)}
.tile small,.muted{color:var(--muted)}
.tag{display:inline-block;font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:0 10px;color:var(--muted)}
.tag.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.sec h2{font-size:1.5rem;color:var(--brand);margin-bottom:10px}
.sec h3{font-size:1.15rem;margin:22px 0 6px}
.prose{max-width:70ch}
.prose p,.prose li{margin:.4em 0}
.prose ul,.prose ol{padding-inline-start:1.4em}
.lecthead{border-inline-start:6px solid var(--medal);padding-inline-start:16px}
.lecthead h1{font-size:clamp(1.5rem,4vw,2.1rem);color:var(--brand)}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.93rem}
th,td{padding:9px 12px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--medal-soft);font-weight:700}
tr:last-child td{border-bottom:0}
.note{background:var(--medal-soft);border-inline-start:5px solid var(--medal);padding:10px 16px;border-radius:6px;margin:14px 0;max-width:70ch}
.eq{font-family:var(--f-display);text-align:center;font-size:1.1rem;color:var(--brand);background:var(--surface);border:1px dashed var(--medal);border-radius:8px;padding:12px;margin:14px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:8px 18px;font-weight:600}
.btn.alt{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 14px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.fc{perspective:1000px;min-height:230px;cursor:pointer}
.fc .face{min-height:230px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem}
.fc.back .face{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.opt{display:block;width:100%;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--medal)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{padding:10px 14px;border-radius:8px;background:var(--warn-soft);margin-top:10px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--medal)}
label{display:block;font-weight:600;margin:12px 0 4px}
textarea,input[type=search],input[type=text],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
textarea{min-height:76px;resize:vertical}
.chk{display:flex;gap:10px;align-items:flex-start;padding:5px 0}
.chk .dot{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;border:2px solid var(--line)}
.chk.ok .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.chk.bad .dot{background:var(--bad);border-color:var(--bad);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.msgprev{white-space:pre-wrap;background:var(--bg);border:1px dashed var(--medal);border-radius:8px;padding:14px;min-height:120px}
mark{background:var(--medal-soft);color:inherit;padding:0 2px}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-block:18px 40px}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:20px}.ring{width:96px;height:96px}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.tile{transition:border-color .15s}}
</style>

<div id="app" dir="rtl" lang="ar"></div>

<script>
"use strict";
/* ============ DATA ============ */
var LECT=[
{id:1,t:"مدخل إلى المنظور الإعلامي والنفسي والاجتماعي",by:"أستاذ المقرر",sub:"الأزمة والكارثة والطوارئ، وتكامل المحاور الثلاثة",b:[
["h","أهداف المحاضرة"],
["ul",["تفسير مفاهيم الأزمة والكارثة والطوارئ والتمييز بينها.","فهم أهمية المحور الإنساني والنفسي في إدارة الأزمات.","تحليل العلاقة بين الإعلام وعلم النفس وعلم الاجتماع عند إدارة المخاطر.","إدراك أثر الاتصال الاستراتيجي الواعي في الحد من التداعيات والشائعات.","استيعاب أهمية دمج الأبعاد الثلاثة ضمن منظومة الأمن القومي الشامل."]],
["h","المفاهيم الأساسية"],
["p","<b>الأزمة (Crisis):</b> موقف حرج ونقطة تحول تتسم بالتعقيد والمفاجأة والتهديد المباشر للقيم الحيوية أو الأهداف الاستراتيجية، وتتطلب قرارات حاسمة في وقت ضيق تحت ضغوط نفسية وإعلامية شديدة."],
["p","<b>الكارثة (Disaster):</b> حدث فجائي مفجع يصيب المجتمع ويحدث دمارًا واسعًا في الأرواح والممتلكات، وتتفوق تداعياته غالبًا على الإمكانيات المحلية للمواجهة."],
["tb",["وجه المقارنة","الطوارئ","الأزمة","الكارثة"],[
["عنصر المفاجأة","محدود، ومحتوى في سيناريوهات الاستجابة","عالٍ ويعيد ترتيب الأولويات","مفاجئ وشامل لجميع القطاعات"],
["مستوى التهديد","تشغيلي ومحلي محدود","استراتيجي يهدد كيان المنظومة","وجودي، دمار وشلل كامل"],
["القدرة على السيطرة","ضمن الإمكانيات الاعتيادية","إدارة استثنائية وتنسيق","استغاثة ودعم خارجي"],
["البعد الإعلامي والنفسي","تغطية روتينية محدودة الأثر","حرب معلومات وضغوط نفسية مكثفة","صدمة مجتمعية واحتياج للدعم الإنساني"]]],
["h","المحاور الثلاثة"],
["ul",["<b>الإعلامي:</b> إدارة التدفق المعرفي بمعلومات موثوقة ومستمرة تمنع الفراغ الذي تستغله الشائعات؛ وتوجيه الرأي العام بلغة متوازنة؛ وحماية السمعة المؤسسية.","<b>النفسي:</b> ديناميكيات الخوف والقلق (الشراء الهستيري وإنكار الواقع)، وأثر التوتر في متخذ القرار، والصدمات المجتمعية، وبناء المرونة النفسية الوطنية.","<b>الاجتماعي:</b> تعزيز التضامن عبر الشبكات الأهلية والعمل التطوعي، ومكافحة الاحتكار والتنمر واستغلال الطوارئ."]],
["note","البعد الإنساني: إغفال المشاعر وردود الأفعال الناتجة عن الخوف والصدمة يؤدي إلى فشل خطط المواجهة مهما كانت دقتها اللوجستية. ويرتكز الاحتواء على الشفافية والتعاطف والدعم النفسي الفوري للمتأثرين ولفرق الاستجابة."],
["h","مراحل الاتصال الاستراتيجي للأزمات"],
["ol",["<b>ما قبل الأزمة:</b> الإنذار المبكر، التنبؤ، سيناريوهات التدريب الإعلامي والنفسي.","<b>اندلاع الأزمة:</b> الاستجابة السريعة، المتحدث الرسمي، احتواء الصدمة الأولى.","<b>تفاقم الأزمة:</b> دحض الشائعات، الدعم المجتمعي والنفسي المستمر.","<b>التعافي:</b> التقييم الاستراتيجي، إعادة بناء الثقة، التعلم المستفاد."]],
["note","تذكر الشريحة 12 أن الاتصال الاستراتيجي المبكر المستند إلى علم النفس الاجتماعي يقلل انتشار الشائعات «بنسبة تصل إلى 85%»، ولا تذكر مصدرًا لهذا الرقم. والنسب في رسمَي الشريحتين 10 (35% و30% و35%) و14 (95% و85% و88% و78%) توضيحية في الشرائح نفسها وغير موثقة، فلا تعاملها كنتائج بحثية."]]},
{id:2,t:"المفهوم الإعلامي للأزمات والكوارث وخصائص الإعلام وقت الأزمات",by:"المحاضرة الثانية",sub:"وظائف الإعلام قبل الأزمة وأثناءها وبعدها",b:[
["h","أهداف المحاضرة"],
["ul",["تفسير مفهوم الإعلام ودوره الاستراتيجي في إدارة الأزمات.","تحليل وظائف الإعلام قبل الأزمة وأثناءها وبعدها.","المقارنة بين الإعلام التقليدي والرقمي في إدارة الأزمات.","تحديد خصائص الرسالة الفعالة وقت الأزمة، ودور الإعلام في تشكيل الإدراك وإدارة المخاطر.","تطبيق المبادئ المهنية والمسؤولية الأخلاقية."]],
["h","لماذا الإعلام عنصر استراتيجي؟"],
["ul",["<b>توجيه الرأي العام وإدارة الإدراك:</b> صياغة الوعي الجمعي وإدارة التوتر؛ والبث الموثوق المستمر يمنع الشائعات ويهدئ الفزع ويوجه المواطنين لإرشادات السلامة.","<b>دعم صناع القرار:</b> قنوات اتصال مباشرة وسريعة بين الدولة والجمهور تعزز شرعية القرارات وتدعم فرق الأزمة."]],
["p","<b>إعلام الأزمات والكوارث:</b> فرع متخصص من الاتصال الجماهيري يهدف إلى جمع ونشر المعلومات الدقيقة والسريعة أثناء الأحداث الطارئة وغير العادية التي تهدد الأرواح أو الممتلكات أو الاستقرار العام. ويعتمد المفهوم الحديث على التفاعلية والتنسيق الموحد."],
["h","تطور الإعلام في إدارة الأزمات"],
["tb",["النوع","الخاصية"],[["التقليدي","صحف وإذاعة؛ تغطية لاحقة وتحديثات بطيئة ومحدودة"],["الفضائي","بث مباشر مستمر ووصول فوري عابر للحدود"],["الرقمي","شبكات تواصل وتفاعل فوري ومحتوى ينشئه المستخدم"],["الذكي","ذكاء اصطناعي وبيانات ضخمة للتنبؤ والتوجيه"]]],
["h","وظائف الإعلام عبر المراحل الثلاث"],
["tb",["المرحلة","الوظائف"],[
["قبل الأزمة","1) الإنذار المبكر والرصد. 2) التوعية والتثقيف ورفع الجاهزية المجتمعية. 3) التخطيط الاتصالي: سيناريوهات المواجهة وتجهيز الفرق وتحديد الخطاب الرسمي والشبكات البديلة."],
["أثناء الأزمة","الإعلام اللحظي، مواجهة الشائعات، المتحدث الرسمي الموحد لمنع التناقض، الطمأنة والإرشاد."],
["بعد الأزمة","التقييم والتوثيق وتسجيل الدروس، التعافي النفسي والاجتماعي وتعزيز التضامن، وإعادة بناء الصورة الذهنية واستعادة الثقة."]]]]},
{id:3,t:"نظريات الإعلام والاتصال في إدارة الأزمات والكوارث",by:"أستاذ المقرر",sub:"ترتيب الأولويات، التأطير، استعادة الصورة، SCCT، وغيرها",b:[
["h","لماذا النظريات؟"],
["ul",["النظرية توفر إطارًا علميًا لتفسير العلاقة بين الأزمة والإعلام والجمهور وصانع القرار.","الإعلام لا ينقل الحدث فقط، بل يساهم في تحديد ما يعرفه الجمهور وما يراه مهمًا وكيف يفسره.","إدارة الأزمة إعلاميًا هي إدارة للمعنى والإدراك والثقة والسلوك، لا للمعلومات فقط.","المعلومة الصحيحة لا تكفي إذا قُدمت في إطار غير مفهوم أو من مصدر فاقد للمصداقية."]],
["h","ترتيب الأولويات والتأطير"],
["p","<b>ترتيب الأولويات (Agenda-Setting):</b> ماكومبز وشو 1972. الإعلام يؤثر في القضايا التي يوليها الجمهور اهتمامًا عبر بروز القضية وتكرارها وموقعها. في الكارثة الواحدة قد يركز على الخسائر البشرية، أو كفاءة الإنقاذ، أو البنية التحتية والمسؤولية الإدارية. المطلوب مهنيًا: إدارة واعية للأجندة دون إخفاء المعلومات أو التلاعب بها."],
["p","<b>التأطير (Framing):</b> روبرت إنتمان. الإطار طريقة اختيار جوانب من الواقع وإبرازها وربطها بتعريف المشكلة وأسبابها وتقييم المسؤولية والحلول."],
["tb",["الإطار","السؤال الذي يجيب عنه"],[["المسؤولية","من المسؤول عن الأزمة؟"],["الضحية","من تضرر ومن يحتاج المساعدة؟"],["الصراع","من يختلف مع من؟"],["الحل","ما الإجراءات التي تخفف الأزمة؟"],["الخوف","ما المخاطر والتهديدات المحتملة؟"],["التضامن","كيف يتعاون المجتمع والمؤسسات؟"]]],
["note","ترتيب الأولويات يركز على أهمية القضية وبروزها، والتأطير على طريقة تعريفها وتفسيرها. الجمع بينهما يفسر: ماذا يرى الجمهور؟ وكيف يفهم ما يراه؟"],
["h","استعادة الصورة (Image Repair)"],
["p","ويليام بنوا. الأزمة تهدد سمعة المؤسسة، والسؤال المركزي: ماذا ينبغي أن تقول المؤسسة عندما تصبح صورتها مهددة؟ ويتناسب اختيار الاستراتيجية مع طبيعة الحدث ودرجة المسؤولية وإدراك الجمهور لها."],
["tb",["الاستراتيجية","المعنى"],[["الإنكار","رفض المسؤولية عندما تكون المؤسسة غير مسؤولة فعلًا"],["التبرير","توضيح الظروف والعوامل التي أدت إلى الحدث"],["تقليل الإساءة","تقديم سياق يوضح حدود الضرر أو المسؤولية"],["التصحيح","إعلان إجراءات لمنع تكرار الأزمة"],["الاعتذار وتحمل المسؤولية","مهم عندما تكون المسؤولية ثابتة، ويصحبه تصحيح فعلي"]]],
["h","الاتصال الموقفي في الأزمات (SCCT)"],
["p","وليام تيموثي كومبس. لا توجد استجابة اتصالية واحدة تصلح لكل الأزمات. تعتمد الاستجابة على نوع الأزمة والمسؤولية المدركة وتاريخ الأزمات والسمعة السابقة وتوقعات أصحاب المصلحة."],

["ul",["<b>الاستخدامات والإشباعات:</b> الجمهور يستخدم الإعلام لحاجات: معرفة ما حدث، تقدير الخطر، حماية الذات، متابعة الآخرين، تقليل القلق، التحقق. وقد ينتقل بين منصات بحثًا عن مصدر أوثق. السؤال الصحيح: ماذا يحتاج الجمهور إلى معرفته الآن؟","<b>الاعتماد على وسائل الإعلام:</b> تزداد أهمية الإعلام عند الغموض وعدم الاستقرار، وكلما زاد عدم اليقين زادت الحاجة إلى مصادر موثوقة. الساعات الأولى شديدة الحساسية.","<b>دوامة الصمت:</b> قد يمتنع الفرد عن التعبير إذا شعر أن رأيه أقلية، وفي الرقمي بسبب التنمر أو الهجوم الإلكتروني، فيبدو إجماعٌ غير حقيقي.","<b>فجوة المعرفة:</b> المعلومات لا تصل بالدرجة نفسها لكل أفراد المجتمع بسبب التعليم والقدرة الاقتصادية والوصول التقني والثقافة الرقمية والعمر والموقع. الحل: رسائل متعددة المستويات والقنوات.","<b>الخوارزميات:</b> المشاركة والتفاعل يحددان ظهور المحتوى، والأكثر انتشارًا ليس بالضرورة الأدق، فيجب دمج التحقق مع الرصد المستمر."]],

["h","الأهداف الاستراتيجية"],
["ul",["حماية الأرواح بإيصال التحذيرات والإخلاء بسرعة.","تقليل عدم اليقين: ما نعرفه وما نتحقق منه وما سيحدث لاحقًا.","الحد من الشائعات ببديل موثوق ومحدث.","الحفاظ على الثقة بالشفافية والاتساق وتجنب الإنكار والتناقض.","توجيه السلوك بتعليمات واضحة قابلة للتنفيذ."]],
["h","النموذج العملي: سبع مراحل"],

["tb",["القناة","متى تناسب"],[["المؤتمر الصحفي","الإعلانات المهمة والأسئلة والتحديثات واسعة الاهتمام"],["البيان الرسمي","موقف موحد وموثق"],["الموقع الرسمي","مصدر مركزي للمعلومات والتحديثات والوثائق"],["وسائل التواصل","التحذيرات السريعة والتفاعل وتصحيح الشائعات"],["الرسائل النصية والتنبيهات","التعليمات العاجلة والتحذير المباشر"],["التلفزيون والإذاعة","وصول واسع وسريع لشرائح متنوعة"]]],
["h","الرسالة الأولى (الساعات الأولى)"],
["ol",["<b>الاعتراف:</b> تتابع الجهة المختصة الحدث منذ وقوعه.","<b>الحقيقة المؤكدة:</b> المعلومات المتاحة تشير إلى…","<b>الإجراء:</b> بدء الاستجابة من الجهات المعنية.","<b>التعليمات:</b> يرجى اتباع التالي…","<b>التعاطف:</b> ندرك حجم القلق ونتابع أوضاع المتضررين.","<b>التحديث:</b> ستُعلن المستجدات عبر القنوات الرسمية في…"]],

["h","الثقة والصورة الذهنية"],
["ul",["الثقة نتيجة تراكم من الأداء والشفافية والاتساق. وإذا فقد الجمهور الثقة فقد لا يستجيب حتى للتعليمات الصحيحة.","الشفافية لا تعني كشف كل شيء، بل عدم التضليل.","قد ينتقل الأثر: <b>أزمة حدث ← أزمة سمعة ← أزمة ثقة</b>."]],

{id:5,t:"إدارة المعلومات والشائعات",by:"أستاذ المقرر",sub:"الشائعة والخبر الزائف والتضليل والحرب المعلوماتية",b:[
["p","الفكرة المحورية: الثقة في الشخص الذي نقل المعلومة لا تعني صحة المعلومة نفسها. والتحدي اليوم هو الكم الهائل الذي يصعّب التمييز بين الصحيح والخاطئ والمضلل."],
["h","إدارة المعلومات"],
["p","عملية جمع المعلومات وتحليلها والتحقق منها وتنظيمها ونقلها إلى الشخص المناسب في الوقت المناسب لاتخاذ القرار الصحيح. وليست جمع أكبر قدر من البيانات، فقد تكون المعلومات غير موثوقة أو قديمة أو خارج سياقها أو غير مكتملة أو تصل للشخص الخطأ."],
["eq","الشائعة ← الخوف ← الشراء الزائد ← زيادة الطلب ← نقص مؤقت ← زيادة الأسعار ← مزيد من الخوف"],
["note","المعلومة وقت الأزمة قد تتحول إلى سلوك سلبي، والسلوك قد يتحول إلى أزمة."],
["h","الشائعة والخبر الزائف والتضليل"],
["tb",["المفهوم","الفكرة الأساسية"],[["الشائعة","معلومة أو ادعاء غير مؤكد ينتشر بين الناس عند نقص المعلومات الموثوقة أو الغموض؛ وليست بالضرورة كذبة متعمدة من البداية"],["الخبر الزائف","محتوى يُقدَّم في صورة خبر لكنه غير صحيح أو مختلق أو مشوه"],["التضليل","استخدام المعلومات بطريقة تؤدي إلى فهم أو استنتاج خاطئ، وقد تكون المعلومات صحيحة جزئيًا"],["المعلومات المضللة","محتوى قد يكون خاطئًا أو مجتزأ أو خارج السياق ويؤثر في فهم الجمهور"]]],
["p","يجب التمييز بين منشئ المعلومة المضللة ومن شاركها معتقدًا صحتها."],
["h","لماذا تنتشر الشائعات؟"],
["ol",["أهمية الموضوع (وظائف، أسعار، امتحانات، رواتب، قرارات، خدمات، أزمات صحية).","الغموض.","القلق والخوف.","سرعة وسائل التواصل الاجتماعي."]],
["p","مثال الجامعة: إلغاء محاضرة دون تفسير يولّد روايات (الدكتور مريض، الامتحان سيتغير، المادة أُلغيت). المسؤول ليس شخصًا واحدًا بل: غياب المعلومة الرسمية + سرعة التواصل + القلق + التفسير الشخصي."],
["h","صور التضليل"],
["ul",["حذف جزء مهم من الحقيقة.","إخراج تصريح من سياقه.","صورة قديمة مع حدث جديد.","فيديو حقيقي مع تعليق غير صحيح.","التلاعب بالأرقام.","عنوان مثير لا يعكس المحتوى.","انتقاء معلومة وإخفاء بقية الصورة."]],
["note","الحقيقة الجزئية لا تعني بالضرورة الصورة الكاملة: «ارتفعت الأسعار 20%» قد تخص منطقة أو فترة أو نوعًا محددًا، ثم تُقدَّم كأنها «كل الأسعار في كل مكان»."],
["h","قاعدة التحقق: توقف – تحقق – قرر"],
["ul",["<b>توقف:</b> لا تشارك الخبر فورًا.","<b>تحقق:</b> من المصدر؟ هل يوجد مصدر رسمي؟ متى نُشر؟ هل توجد مصادر مستقلة؟ هل الصورة حديثة؟ هل العنوان يوافق المحتوى؟ هل توجد أرقام أو أدلة؟","<b>قرر:</b> إذا لم نستطع التحقق فلا ننشر. وعدم مشاركة خبر غير مؤكد سلوك مسؤول."]],
["h","الحرب المعلوماتية"],
["p","استخدام المعلومات أو استهداف نظم المعلومات للتأثير في قرارات الخصم أو سلوكه أو معنوياته أو قدرته على العمل. وقد لا يكون الهدف إقناع الجمهور بكذبة محددة، بل دفعه إلى فقدان الثقة أو سلوك معين: فقدان الثقة ← الذعر ← السلوك الاندفاعي ← الضغط على المؤسسات."],
["h","إدارة المعلومات أثناء الأزمة"],
["p","أربعة تحديات: <b>السرعة، الدقة، الشفافية</b> (إذا لم نعرف لا نخترع إجابة)، <b>الثقة</b>."],
["ol",["<b>الرصد:</b> ما الذي ينتشر؟ أين؟ من ينشره؟ ما مدى انتشاره؟","<b>التحقق:</b> صحيحة؟ قديمة؟ خارج السياق؟ أدلة؟","<b>التصنيف:</b> صحيحة، خاطئة، غير مؤكدة، صحيحة جزئيًا، خارج السياق.","<b>التواصل:</b> واضحة، قصيرة، دقيقة، مباشرة، من مصدر موثوق، مناسبة للجمهور.","<b>المتابعة:</b> هل توقفت الشائعة؟ هل ظهرت نسخة جديدة؟ هل فُهمت الرسالة؟ أسئلة جديدة؟"]],
["note","تجاهل الشائعة ليس دائمًا الحل، وقد يزيد انتشارها. الأفضل تقديم الحقيقة بوضوح ومصدر موثوق والرد على المخاوف الأساسية."],
["h","لماذا يصدق الناس الشائعات؟"],
["p","الخوف والقلق والغضب والانتماء والثقة في المرسل والرغبة في تصديق ما يوافق الأفكار السابقة. <b>التحيز التأكيدي:</b> ميل الإنسان إلى قبول المعلومات المتفقة مع معتقداته بسهولة أكبر. والسؤال: هل صدقت الخبر لأنه صحيح أم لأنني أحببت أن يكون صحيحًا؟"],
["h","تمرين «محقق المعلومات»: علامات الخطر"],
["ul",["مصدر مجهول، ولا جهة رسمية.","لا تاريخ واضح، ولا رابط.","لغة عاطفية، وكلمة «عاجل» دون دليل.","الضغط على الجمهور للمشاركة بسرعة."]],
["note","القاعدة الذهبية: كلما دفعك المحتوى إلى أن تتصرف بسرعة، أعطِ نفسك وقتًا أطول للتحقق."],
["h","النموذج المتكامل"],
["eq","ارصد ← تحقق ← قيّم ← تواصل ← تابع"],
["p","رسالة الختام: <b>لا تكن أول من ينشر المعلومة؛ كن أول من يتحقق منها.</b>"]]},
{id:6,t:"الإعلام الرقمي ووسائل التواصل وإدارة الأزمات",by:"أ.د. وسام نصر",sub:"فجوة المعلومات والثقة، CERC وRACE، وغرفة الطوارئ الرقمية",b:[
["p","المنصة الرقمية ليست أداة نشر فقط، بل بنية اجتماعية وتقنية سريعة الإنتاج، تعيد ترتيب مصادر السلطة وتحوّل الجمهور إلى طرف فاعل في الأزمة. فالمؤسسة لا تدير رسالتها وحدها بل بيئة معلومات متحركة."],
["p","قيمة التواصل الاجتماعي في الأزمات في ثلاث وظائف متزامنة: <b>الإنذار المبكر، التحديث الفوري، الاستماع إلى أسئلة ومخاوف الجمهور</b>."],
["tb",["المفهوم","ما يعنيه","الخطر"],[["المعلومة","ادعاء بمصدر يمكن فحصه","تقديم الادعاء كحقيقة"],["الشائعة","معلومة غير مؤكدة تنتشر في بيئة قلق","تكرارها دون تحقق قد يزيد انتشارها"],["التضليل","محتوى خاطئ أو مضلل، متعمد أو غير متعمد","مواجهة كل خطأ بلغة اتهامية"],["المعلومة المضللة المقصودة","محتوى كاذب يُوظف عمدًا للإرباك أو الإضرار","إهمال الدافع والجهة المنتجة"],["الاستجابة","ما تقوله وتفعله المؤسسة الآن","بيان بلا إجراء عملي أو قناة مساعدة"]]],
["h","الأزمة بوصفها فجوة معلومات وثقة"],
["p","تتكون عندما تتسع الفجوة بين ما يحتاج الجمهور إلى معرفته وما تستطيع المؤسسة قوله في اللحظة نفسها: فجوة <b>زمنية</b> (تأخر)، أو <b>معرفية</b> (لا تشرح معنى الأرقام)، أو <b>أخلاقية</b> (رسالة منفصلة عن معاناة المتضررين). والإدارة الجيدة هي تقليل عدم اليقين بصدق وبشكل مفهوم."],
["tb",["مرحلة الأزمة","السؤال الاتصالي","المهمة الرقمية"],[["الإنذار","ما الإشارة المبكرة؟","رصد الكلمات المفتاحية وتصعيد التنبيه"],["التصاعد","من المتضرر وما الخطر؟","تثبيت الحقائق وتحديد المتحدث والقنوات"],["الذروة","ما الإجراء الآن؟","تعليمات عملية وتحديثات منتظمة وإدارة الأسئلة"],["الانحسار","ما الذي انتهى وما الذي يستمر؟","تفسير النتائج ودعم المتضررين"],["التعلم","كيف لا يتكرر الخلل؟","تقرير ما بعد الأزمة وتعديل البروتوكولات"]]],
["h","ثلاثة أطر"],
["ul",["<b>SCCT:</b> يربط أسلوب الرد بدرجة مسؤولية المؤسسة كما يدركها الجمهور. المؤسسة الضحية تركز على المعلومات والتعليمات، وإن احتمل مساهمتها في الخلل زادت الحاجة إلى التعاطف وتحمل المسؤولية وتصحيح الإجراء. الخطأ الشائع استخدام الإنكار في كل الحالات.","<b>CERC</b> (الاتصال بالمخاطر والأزمات في حالة الطوارئ): من التعاطف والتهدئة الأولية إلى شرح الحقائق ثم دعوة الجمهور إلى الفعل ثم التحديث والتقييم. والرسالة الأولى تجيب: ماذا حدث؟ ماذا نعرف؟ ماذا يفعل الناس الآن؟ متى التحديث التالي؟","<b>RACE:</b> Research البحث (رصد الحوار ومصادر الادعاء والفئات المتضررة ونبرة النقاش)، Action/Planning التخطيط (الهدف والرسالة والمتحدث والقناة والموافقات والموارد)، Communication الاتصال (النشر وإدارة التعليقات)، Evaluation التقييم (الفهم والسلوك والثقة ثم التعديل)."]],
["h","غرفة الطوارئ الرقمية"],
["tb",["الوحدة","المسؤولية","قاعدة العمل"],[["الرصد","التقاط الإشارات والادعاءات","لا تنشر كل ما ترصده"],["التحقق","فحص المصدر والزمن والمكان","وثّق رابط الدليل ووقت التحقق"],["القرار","تحديد من يعتمد الرسالة","اختيار الإجراء ومستوى التصعيد"],["المحتوى","تحويل الحقيقة إلى نص وصورة وفيديو","اكتب للقراءة السريعة وعلى الهاتف"],["المتحدث","الشرح والاعتراف والتعاطف","لا يتكهن ولا يلوم الضحايا"],["خدمة الجمهور","الردود الفردية والإحالات","انقل الحالات الحساسة إلى قناة خاصة"],["القياس","متابعة الوصول والفهم والثقة","اربط المؤشر بقرار لا برقم شكلي"]]],
["h","لماذا تتضخم الأزمات على المنصات؟"],
["ul",["<b>السرعة:</b> قد يصل الادعاء لآلاف قبل أن تراجعه المؤسسة.","<b>الخوارزميات:</b> المحتوى المثير للخوف أو الغضب يحصد تفاعلًا أكبر.","<b>إعادة السياق:</b> صورة قديمة أو مقطع من بلد آخر يُقدَّم كحدث راهن.","<b>تعدد الأصوات:</b> موظف وشاهد وصحفي ومؤثر وصفحة مجهولة وجهة رسمية معًا.","<b>الضغط البصري:</b> صورة تختصر أزمة لكنها قد تخفي التاريخ والمكان والسبب.","<b>أثر الصمت:</b> غياب الرسالة الرسمية يترك فراغًا تملؤه التكهنات."]],
["note","قاعدة تدريسية: لا تحاول المؤسسة أن تكون الأسرع في كل شيء، بل الأسرع في الاعتراف بما تعرفه وتحديد ما لا تعرفه وشرح متى ستحدّث الجمهور."],
["h","إطار عملي من ثلاث مراحل"],
["ul",["<b>قبل الأزمة (الجاهزية):</b> سيناريوهات محتملة، قائمة أصحاب مصلحة، متحدث رسمي وبديل، قوالب جاهزة (بيان أولي، تحديث حالة، أسئلة وأجوبة، اعتذار وتصحيح، رسالة إغلاق)، لوحة رصد، تدريب دوري.","<b>أثناء الأزمة (الاستجابة):</b> تسلسل <b>اعترف – تحقق – وجّه – حدّث</b>.","<b>بعد الأزمة:</b> ملخص زمني يميز المؤكد عن قيد التحقيق، شكر المتعاونين ودعم المتضررين دون استغلال قصصهم، قياس ما تغير في الأسئلة والمشاعر وليس الوصول فقط، تحديث الخطة."]],
["h","أخلاقيات وخصوصية"],
["ul",["لا تنشر أسماء أو صور المتضررين أو بياناتهم الصحية دون ضرورة ومشروعية واضحة.","لا تستخدم صور الأطفال أو المرضى لإثارة التعاطف أو زيادة الوصول.","لا تخلط بين تصحيح المعلومة وفضح صاحبها.","احفظ سجل التعديلات: ماذا نُشر؟ متى؟ لماذا عُدّل؟ من اعتمد؟","لغة بسيطة وبدائل لذوي الإعاقة، فالوصول جزء من العدالة الاتصالية."]],
["h","مصفوفة الرسالة والمنصة"],
["tb",["الجمهور","السؤال","القناة الأنسب","مؤشر النجاح"],[["المتضررون مباشرة","ماذا أفعل الآن؟","واتساب / هاتف / صفحة خدمة","انخفاض الأسئلة المكررة وزمن الانتظار"],["الجمهور العام","هل الخطر حقيقي؟","فيسبوك / إكس / إنستغرام","نسبة الفهم والمشاركة الصحيحة"],["الإعلام","من الدليل؟ من المتحدث؟","موقع المؤسسة / بريد صحفي","دقة التغطية"],["الموظفون","ما دوري؟","قناة داخلية / بريد","الالتزام بالتعليمات"],["الشركاء والجهات","كيف ننسق؟","اجتماع / مذكرة / لوحة مشتركة","تطابق الأرقام والرسائل"]]],
["h","دراستا حالة مصريتان"],
["p","<b>كوفيد-19:</b> احتاجت الجهات إلى الاتصال في بيئة تتغير فيها المعرفة الطبية يوميًا. وفق ما أوردته المحاضرة: حملات توعية مكثفة، واستخدام الصحة تطبيقات ذكية ومنصات تواصل، وحملات اتصال بالمخاطر على التلفزيون والإذاعة والتواصل واللوحات والحافلات، وحملات ضد الوصمة. ومن الأمثلة حملة أغنية «هنعيش مع بعض» التي ذكر تقرير للأمم المتحدة أنها تجاوزت 3 ملايين مشاهدة في أسبوع بمشاركة أكثر من 15 شخصية عامة. الدرس: الجمع بين الرسالة الطبية والاجتماعية (طلب المساعدة ليس عارًا، والعاملون الصحيون يحتاجون دعمًا)."],
["p","<b>إيفرغيفن (قناة السويس، مارس 2021):</b> تعطل المجرى الملاحي ستة أيام. صور القاطرات والكراكة الصغيرة بجوار السفينة أثارت تعليقات واسعة، فصارت الأزمة أزمة صورة وتوقعات ومسؤولية وتفاوض، لا تشغيلية فقط. وتدرّس الحالة «تعدد الجماهير»: ملاك السفن، التجارة العالمية، الجمهور المصري، البحارة وأسرهم، الإعلام؛ ولا تكفي رسالة عامة واحدة."],
["h","مؤشرات الأداء أثناء الأزمة"],
["ul",["زمن الاكتشاف، زمن الاعتراف، زمن التصحيح.","نسبة الوصول إلى المصدر الرسمي.","نوعية الأسئلة، ودقة الفهم (عينة قصيرة تشرح الإجراء المطلوب).","المشاعر واللغة (الخوف والغضب والثقة) دون اختزالها في رقم.","الامتثال والنتيجة التشغيلية."]],
["note","عدد المشاهدات قد يكون مرتفعًا والرسالة فاشلة إذا لم يفهم الجمهور الإجراء أو لم يثق بالمصدر."],
["h","أخطاء شائعة"],
["ul",["الإنكار قبل التحقق.","التأخير بحجة اكتمال المعلومات.","اللغة القانونية الباردة.","الرد على كل تعليق بالصيغة نفسها.","إعادة نشر الشائعة كاملة (تمنحها حياة ثانية).","الخلط بين الاعتذار والاعتراف القانوني.","كشف بيانات المتضررين.","قياس النجاح بالتفاعل فقط."]],
["p","<b>قواعد المحاكاة:</b> لا تقل «لا داعي للقلق» دون تفسير أو إجراء؛ لا تعرض الصورة المضللة بحجم يزيد وصولها؛ ميّز بصريًا ولغويًا بين المؤكد وقيد التحقق؛ احمِ الخصوصية في كل رد عام."]]},
{id:7,t:"التأثيرات النفسية للأزمات والدعم النفسي والاجتماعي",by:"أ.د. وسام نصر",sub:"الخوف والذعر والصدمة، الإسعافات النفسية الأولية، والتغطية الأخلاقية",b:[
["p","الفكرة المركزية: الأزمة تهدد البنية المادية وكذلك إحساس الأفراد بالأمان والسيطرة والمعنى. والإدارة الناجحة تدير المعلومة والانفعال والعلاقات الاجتماعية والخدمات النفسية معًا. والإعلام قد يخفف الغموض ويعزز الثقة، أو يضاعف الخوف إذا نقل الشائعات والصور الصادمة بلا مسؤولية."],
["p","<b>حدود المحاضرة:</b> تطبيق مبادئ الإسعافات النفسية الأولية دون ممارسة علاج نفسي أو تشخيص طبي."],
["h","الأزمة والكارثة"],
["tb",["وجه المقارنة","الأزمة","الكارثة"],[["النطاق","قد تكون محدودة أو متوسطة وقد تتسع","واسع ومتعدد القطاعات غالبًا"],["القدرة على الاستجابة","قد تكفي موارد المؤسسة مع دعم إضافي","تتطلب تنسيقًا واسعًا وموارد استثنائية"],["الأثر","تهديد للسمعة أو التشغيل أو الثقة أو السلامة","خسائر بشرية ومادية واجتماعية وتعطل الخدمات"],["الإعلام","سرعة ودقة وتوحيد الرسائل","معلومات متعددة المصادر وحماية الخصوصية وتغطية التعافي"],["الدعم النفسي","قد يتركز في المتأثرين والعاملين","يمتد إلى الناجين والأسر والمستجيبين والمجتمع"]]],
["note","ليست كل أزمة كارثة، لكن الكارثة تتضمن عادةً أزمات متزامنة: سلامة، معلومات، ثقة، خدمات، وربما أزمة نفسية واجتماعية."],
["h","ثلاثة أمثلة"],
["ul",["<b>إيفرغيفن 2021:</b> بدأ حادثًا ملاحيًا ثم صار أزمة تشغيلية واقتصادية واتصالية؛ الغموض حول مدة الانسداد زاد القلق الاقتصادي.","<b>كوفيد-19:</b> وصفته منظمة الصحة العالمية بالجائحة في 11 مارس 2020 بعد إعلان حالة طوارئ صحية عامة في 30 يناير. اجتمعت مشاعر الخوف والقلق والحزن والإرهاق والغضب من المعلومات المتضاربة.","<b>انفجار مرفأ بيروت 4 أغسطس 2020:</b> كارثة تكنولوجية/صناعية بآثار نفسية واجتماعية ممتدة. على الإعلام شرح احتياجات الناجين والتحقق من الأعداد وحماية صور الأسر والأطفال وتتبع المساءلة والتعافي، مع الانتباه إلى أن التعرض المتكرر للمشاهد الصادمة قد يزيد الضيق."]],
["eq","شدة التهديد المُدرَك + الغموض + فقدان السيطرة − (الدعم + الثقة + الاستعداد) = مستوى الضغط المحتمل"],
["note","المعادلة أداة تفسيرية وليست معادلة إحصائية، تساعد على فهم لماذا يستجيب الأشخاص بطرق مختلفة للحدث نفسه."],
["p","<b>الأسئلة الخمسة التي يبحث عنها الناس:</b> ماذا حدث؟ هل أنا أو أسرتي في خطر؟ ماذا ينبغي أن أفعل الآن؟ من المسؤول عن الاستجابة؟ متى تعود الحياة إلى طبيعتها؟"],
["h","الخوف والذعر"],
["p","<b>الخوف:</b> استجابة إنذار طبيعية ومفيدة تجاه تهديد حقيقي أو متوقع؛ ترفع الانتباه وتسرّع القرار. وهو ليس ضعفًا ولا فشلًا في الشخصية."],
["tb",["المستوى","أمثلة"],[["جسدي","تسارع ضربات القلب، تعرق، ارتجاف، جفاف الفم، اضطراب النوم"],["معرفي","صعوبة التركيز، التفكير في أسوأ الاحتمالات، الانشغال بالبحث عن الأخبار"],["سلوكي","الهروب، التحقق المتكرر، الاتصال المستمر بالأسرة، تجنب المكان"]]],
["p","<b>الذعر:</b> حالة شديدة من الخوف تضيق فيها قدرة الفرد على التفكير المتزن، أو تنتشر سلوكيات اندفاعية بين مجموعة. يزداد احتماله مع تهديد واضح ومعلومات ناقصة، أو غياب قيادة موثوقة، أو شائعة، أو اعتقاد بأن الموارد لا تكفي الجميع. ولا يبدأ من المعلومة وحدها بل من تفاعل الغموض وانخفاض الثقة والتقليد وإعادة تداول المحتوى خارج سياقه (مثال: شائعة نقص المياه)."],
["p","<b>الرسالة الإعلامية وقت الذعر:</b> وصف دقيق لما تأكد مع فصله عن غير المؤكد؛ مصدر واضح للتحديثات؛ تعليمات قصيرة قابلة للتنفيذ؛ اعتراف بالمخاوف دون تهويل؛ نفي الشائعة مع تقديم المعلومة البديلة لا مجرد «لا تصدقوا»؛ تحديثات منتظمة حتى دون تغيير كبير."],
["h","الصدمة والإنكار والغضب"],
["tb",["المفهوم","المعنى"],[["حدث صادم","واقعة شديدة التهديد أو العنف أو الفقد"],["استجابة ضغط حاد","أعراض مؤقتة عقب الحدث: أرق وارتباك وخوف"],["اضطراب ما بعد الصدمة","حالة سريرية تحتاج تقييمًا مهنيًا، ولا تثبت بمجرد مشاهدة خبر أو الشعور بالحزن"]]],
["p","قد تظهر الصدمة كذهول أو انفصال عن المشاعر أو ارتباك أو تكرار الحديث عن الحدث أو كوابيس أو تجنب أو فرط يقظة. كثير من هذه التفاعلات متوقع في الأيام والأسابيع الأولى ويتحسن معظم الناس مع الأمان والدعم والمعلومات. أما استمرار الأعراض أو شدتها أو تعطيلها للحياة اليومية فيستدعي تقييمًا متخصصًا."],
["p","<b>الإنكار:</b> رفض تصديق وقوع الحدث أو التقليل منه، وقد يكون حماية مؤقتة، لكنه يصبح خطرًا عندما يمنع الإخلاء أو طلب الرعاية أو الالتزام بتعليمات السلامة. لا يُسخر من المنكرين؛ بل معلومات متدرجة ومصادر قابلة للتحقق وتعليمات واضحة وحوار هادئ."],
["p","<b>الغضب:</b> ينتج عن الفقد أو الشعور بالظلم أو ضعف الاستجابة أو غموض المسؤولية. لا يرد الإعلام عليه بالاستفزاز ولا يترك خطاب الكراهية والاتهامات غير الموثقة دون تدقيق. المطلوب: الاعتراف بالألم، والتحقق من الوقائع، وشرح الإجراءات، وتوفير مساحة للشكاوى والمساءلة."],
["h","التكيف والصمود"],
["p","<b>التكيف:</b> تعديل الأفكار والسلوكيات والموارد لمواجهة الوضع الجديد، دون نسيان الخسارة أو إنكار الألم. <b>الصمود النفسي:</b> قدرة متطورة على التكيف مع الشدائد والتعافي منها، وهو ليس صفة ثابتة بل يتأثر بالدعم الأسري والثقة بالمؤسسات والموارد والهوية والخبرة والمعنى والمشاركة في الحل."],

[1,"ما تعريف الأزمة؟","موقف حرج ونقطة تحول يتسم بالتعقيد والمفاجأة والتهديد المباشر للقيم أو الأهداف الاستراتيجية، ويتطلب قرارات حاسمة في وقت ضيق تحت ضغوط نفسية وإعلامية."],

[3,"ما استراتيجيات استعادة الصورة عند بنوا؟","الإنكار، التبرير، تقليل الإساءة، التصحيح، الاعتذار وتحمل المسؤولية."],
[3,"ما الفكرة المركزية في SCCT؟","لا توجد استجابة واحدة تصلح لكل الأزمات؛ تعتمد على نوع الأزمة والمسؤولية المدركة والتاريخ والسمعة وتوقعات أصحاب المصلحة."],

{t:"mcq",q:"أي مما يلي ليس مرحلة من مراحل إدارة المعلومات أثناء الأزمة؟",o:["الرصد","التحقق","التصنيف","الإنكار"],ci:3,e:"المراحل: الرصد، التحقق، التصنيف، التواصل، المتابعة."},
{t:"mcq",q:"مؤشر «زمن الاكتشاف» يقيس:",o:["المدة بين إصدار التصحيح ونشره","المدة بين أول ظهور للادعاء ورصده","المدة بين العلم بالموقف وصدور أول رسالة","عدد مرات مشاركة الرسالة"],ci:1,e:"زمن الاكتشاف يبدأ من أول ظهور للادعاء حتى رصده."},
{t:"mcq",q:"في الإسعافات النفسية الأولية، عبارة «هل المكان آمن؟ هل توجد إصابة؟» تنتمي إلى خطوة:",o:["استمع","اربط","انظر","اعترف"],ci:2,e:"«انظر» تبدأ بتأكيد السلامة وتقدير الاحتياجات العاجلة."},
{t:"tf",q:"إعادة نشر الشائعة كاملة مع تعليق «كذب» تساعد في وقفها.",o:["صح","خطأ"],ci:1,e:"إعادة النشر تمنح الشائعة حياة ثانية."},
{t:"tf",q:"قد يكون الإنكار استجابة طبيعية ومؤقتة للصدمة، لكنه يصبح خطرًا عندما يمنع الإخلاء أو طلب الرعاية.",o:["صح","خطأ"],ci:0,e:"الإنكار وظيفة دفاعية مؤقتة، والخطر في أثره على السلامة."},
{t:"tf",q:"ارتفاع عدد المشاهدات دليل كافٍ على نجاح الرسالة الاتصالية.",o:["صح","خطأ"],ci:1,e:"الرسالة قد تفشل إذا لم يفهم الجمهور الإجراء أو لم يثق بالمصدر."},
{t:"essay",q:"انفجرت أزمة مياه، ونشر أحد الإعلاميين فيديو عمره ثلاث ساعات بوصفه دليلًا على انقطاع كامل للمياه. ضع خطة من أربع خطوات للرد.",m:"<b>نموذج الإجابة:</b> ١) رصد الفيديو وتحديد مصدره وتاريخه ومكانه. ٢) التواصل مع الجهة المختصة للتحقق من وضع الإمدادات. ٣) نشر تصحيح يذكر الادعاء ثم الحقيقة والدليل والتعليمات البديلة، دون إعادة نشر الفيديو كاملًا. ٤) متابعة تداوله وظهور نسخ جديدة وتحديث التصحيح عند الحاجة."},
{t:"essay",q:"تعلن مؤسسة تأخير مواعيد الرحلات بسبب عاصفة. اكتب رسالتها الأولى وفق الأسئلة الأربعة لنموذج CERC.",m:"<b>نموذج الإجابة:</b> ماذا حدث؟ تأخير الرحلات بسبب عاصفة قوية. ماذا نعرف؟ مواعيد الإقلاع الجديدة تُحدَّث كل ساعة، وبعض الرحلات ما زالت قيد المراجعة. ماذا يفعل الناس الآن؟ التواصل مع شركة الطيران عبر الرقم الموحد، وعدم التوجه للمطار قبل التأكيد. متى التحديث التالي؟ الساعة الثامنة مساءً عبر الموقع الرسمي."},
{t:"essay",q:"ما الفرق بين الخوف والذعر؟ وماذا ينبغي للإعلام أن يفعل عندما يتحول الخوف إلى ذعر؟",m:"<b>نموذج الإجابة:</b> الخوف استجابة إنذار طبيعية ومفيدة، والذعر خوف شديد يضيق فيه التفكير المتزن وتنتشر سلوكيات اندفاعية بين مجموعة. ينبغي للإعلام أن يصف ما تأكد بدقة ويفصله عن غير المؤكد، ويقدم تعليمات قصيرة قابلة للتنفيذ، ويعترف بالمخاوف دون تهويل، ويقدم المعلومة البديلة للشائعة، ويلتزم بتحديثات منتظمة."}
];
var EXS={pick:{},show:{},self:{}};
var EXV={};
function pExam(){
  var objT=EX.filter(function(x){return x.t!=="essay"}),right=0,answered=0;
  var h='<section class="sec"><h2>امتحان بأسلوب المحاضر</h2><p class="muted prose">عشرة أسئلة: أربعة اختيار من متعدد، وثلاثة صح أو خطأ، وثلاثة مقالية. تظهر الإجابة الصحيحة فور اختيارك. في الأسئلة المقالية اكتب إجابتك ثم قارنها بنموذج الإجابة وقيّم نفسك.</p>';
  EX.forEach(function(x,i){
    var lab={mcq:"اختيار من متعدد",tf:"صح أو خطأ",essay:"مقالي"}[x.t];
    h+='<div class="panel" style="margin-top:14px"><span class="tag">سؤال '+ar(i+1)+' · '+lab+'</span><h3 style="margin-top:8px">'+x.q+'</h3>';
    if(x.t==="essay"){
      h+='<label for="ex'+i+'">إجابتك</label><textarea id="ex'+i+'" data-ex="'+i+'" placeholder="اكتب إجابتك هنا">'+esc(EXV[i]||"")+'</textarea><div class="row" style="margin-top:10px"><button class="btn alt" data-act="exmodel" data-i="'+i+'">'+(EXS.show[i]?"إخفاء نموذج الإجابة":"عرض نموذج الإجابة")+'</button></div>';
      if(EXS.show[i]){h+='<div class="fb">'+x.m+'</div><div class="row" style="margin-top:8px"><button class="btn" data-act="exself" data-i="'+i+'" data-v="1">غطّيت أهم النقاط</button><button class="btn alt" data-act="exself" data-i="'+i+'" data-v="0">لم أغطّها</button>'+(EXS.self[i]!==undefined?'<span class="muted">'+(EXS.self[i]?"تقييمك: مكتمل":"تقييمك: تحتاج مراجعة")+'</span>':'')+'</div>'}
    }else{
      var a=EXS.pick[i],done=a!==undefined;
      if(done){answered++;if(a===x.ci)right++}
      x.o.forEach(function(o,j){var cls="";if(done){if(j===x.ci)cls=" ok";else if(j===a)cls=" no"}
        h+='<button class="opt'+cls+'" data-act="expick" data-i="'+i+'" data-j="'+j+'"'+(done?' disabled':'')+'>'+o+'</button>'});
      if(done)h+='<div class="fb"><b>'+(a===x.ci?"إجابة صحيحة. ":"الإجابة الصحيحة: "+x.o[x.ci]+". ")+'</b>'+x.e+'</div>';
    }
    h+='</div>';
  });
  var selfOk=Object.keys(EXS.self).filter(function(k){return EXS.self[k]}).length,selfN=Object.keys(EXS.self).length;
  h+='<div class="panel" style="margin-top:18px"><h3>النتيجة</h3><p>الاختيار والصح والخطأ: '+ar(right)+' من '+ar(objT.length)+' (أجبت عن '+ar(answered)+')</p><p>المقالية: قيّمت '+ar(selfN)+' من '+ar(3)+'، مكتمل في '+ar(selfOk)+'.</p><div class="row"><button class="btn alt" data-act="exreset">ابدأ الامتحان من جديد</button></div></div>';
  return h+'</section>';
}

/* ============ ROUTER ============ */
function route(){
  var hsh=(location.hash||"#home").slice(1),pg=hsh,body="";
  var m=/^lec([1-7])$/.exec(hsh);
  if(m){body=pLec(Number(m[1]));pg="lectures"}
  else if(hsh==="lectures")body=pLectures();
  else if(hsh==="theories")body=pTheories();
  else if(hsh==="compare")body=pCompare();
  else if(hsh==="cards")body=pCards();
  else if(hsh==="quiz")body=pQuiz();
  else if(hsh==="sim")body=pSim();
  else if(hsh==="work")body=pWork();
  else if(hsh==="gloss")body=pGloss();
  else if(hsh==="search")body=pSearch();
  else if(hsh==="about")body=pAbout();
  else if(hsh==="exam")body=pExam();
  else{body=pHome();pg="home"}
  var app=$("#app");
  var focusId=document.activeElement&&document.activeElement.id;
  app.innerHTML='<header class="top"><div class="brand"><a class="logo" href="#home">'+MEDAL+'<b>الوسام المنصور</b></a><div class="tools"><button class="ibtn" data-act="theme" aria-label="تبديل المظهر">المظهر</button></div></div><nav aria-label="التنقل">'+NAV.map(function(n){return '<a href="#'+n[0]+'"'+(n[0]===pg?' aria-current="page"':"")+'>'+n[1]+'</a>'}).join("")+'</nav></header><main>'+body+'</main><footer>مبني على محاضرات الدبلوم. راجع «عن المنهج» للمصادر والملاحظات المنهجية.</footer>';
  if(focusId){var f=document.getElementById(focusId);if(f&&f.focus){f.focus();try{if(f.setSelectionRange){var l=f.value.length;f.setSelectionRange(l,l)}}catch(e){}}}
}
var lastHash=null;
window.addEventListener("hashchange",function(){if(location.hash!==lastHash){window.scrollTo(0,0)}lastHash=location.hash;if(!/^#quiz/.test(location.hash)&&timer&&qz&&qz.mode==="exam"&&!qz.done){}route()});

/* ============ EVENTS ============ */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act");
  if(a==="theme"){var cur=P.theme||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");P.theme=cur==="dark"?"light":"dark";applyTheme();save();return}
  if(a==="flip"){fcState.back=!fcState.back;route();return}
  if(a==="fcnext"||a==="fcprev"){var n=fcState.deck.length;fcState.i=(fcState.i+(a==="fcnext"?1:n-1))%n;fcState.back=false;route();return}
  if(a==="fcknown"||a==="fcreview"){var idx=fcState.deck[fcState.i],p=P.known.indexOf(idx);if(a==="fcknown"&&p<0)P.known.push(idx);if(a==="fcreview"&&p>-1)P.known.splice(p,1);save();fcState.i=(fcState.i+1)%fcState.deck.length;fcState.back=false;route();return}
  if(a==="fcshuf"){fcState.deck=shuffle(fcState.deck);fcState.i=0;fcState.back=false;route();return}
  if(a==="fclec"){fcState.lec=Number(t.getAttribute("data-n"));fcBuild();route();return}
  if(a==="cardlec"){fcState.lec=Number(t.getAttribute("data-id"));fcBuild();location.hash="#cards";return}
  if(a==="quizlec"){qz=null;var id=Number(t.getAttribute("data-id"));qStart(Q.map(function(q,i){return i}).filter(function(i){return Q[i][0]===id}),"practice");location.hash="#quiz";return}
  if(a==="qstart"){var sel=Number(($("#qlec")||{}).value||0),m=t.getAttribute("data-m"),ids=Q.map(function(q,i){return i}).filter(function(i){return !sel||Q[i][0]===sel});ids=shuffle(ids);if(m==="exam")ids=ids.slice(0,20);qStart(ids,m);return}
  if(a==="qwrong"){qStart(shuffle(P.wrong.slice()),"practice");return}
  if(a==="qpick"){if(qz.ans[qz.i]&&qz.mode==="practice")return;var pick=Number(t.getAttribute("data-i")),q=qz.items[qz.i],prev=qz.ans[qz.i],ok=pick===q.ci;if(prev&&prev.ok)qz.score--;qz.ans[qz.i]={pick:pick,ok:ok};if(ok)qz.score++;var w=P.wrong.indexOf(q.id);if(!ok&&w<0)P.wrong.push(q.id);if(ok&&w>-1&&qz.mode==="practice")P.wrong.splice(w,1);save();route();return}
  if(a==="qnext"){if(qz.i+1<qz.items.length){qz.i++;route()}else qFinish();return}
  if(a==="qreset"){clearInterval(timer);if(qz&&!qz.done&&qz.ans.length){qFinish();return}qz=null;route();return}
  if(a==="scct"){scctSel=t.getAttribute("data-k");route();return}
  if(a==="simgo"){sm={s:Number(t.getAttribute("data-i")),i:0,pts:0,fb:null};route();return}
  if(a==="simback"){sm={s:-1,i:0,pts:0,fb:null};route();return}
  if(a==="simpick"){var pi=Number(t.getAttribute("data-i"));sm.fb=pi;if(SIM[sm.s].steps[sm.i].o[pi][1])sm.pts++;route();return}
  if(a==="simnext"){sm.i++;sm.fb=null;route();return}
  if(a==="wm"){wm=t.getAttribute("data-m");route();return}
  if(a==="wclear"){WV={};route();return}
  if(a==="wcopy"){var tx=wMsg(),done=function(){t.textContent="تم النسخ"};try{navigator.clipboard.writeText(tx).then(done,function(){selPrev()})}catch(x){selPrev()}return}
  if(a==="rps"){rpSel=Number(t.getAttribute("data-i"));route();return}
  if(a==="rpshow"){rpV.show=!rpV.show;route();return}
  if(a==="expick"){var ei=Number(t.getAttribute("data-i"));if(EXS.pick[ei]===undefined){EXS.pick[ei]=Number(t.getAttribute("data-j"));route()}return}
  if(a==="exmodel"){var mi=Number(t.getAttribute("data-i"));EXS.show[mi]=!EXS.show[mi];route();return}
  if(a==="exself"){var si=Number(t.getAttribute("data-i"));EXS.self[si]=t.getAttribute("data-v")==="1";route();return}
  if(a==="exreset"){EXS={pick:{},show:{},self:{}};route();return}
  if(a==="resetp"){P.visited=[];P.known=[];P.best=0;P.wrong=[];save();route();return}
});
function selPrev(){var el=$("#wprev");if(!el)return;var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("fc")){e.preventDefault();fcState.back=!fcState.back;route()}});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="glq"){glq=t.value;$("#glbody").innerHTML=glRows(GL.filter(function(g){return !glq||norm(g[0]+" "+g[1]).indexOf(norm(glq))>-1}));return}
  if(t.id==="sq"){sq=t.value;$("#sres").innerHTML=sRes();return}
  if(t.getAttribute("data-w")){WV[t.getAttribute("data-w")]=t.value;$("#wprev").textContent=wMsg();$("#wchk").innerHTML=wChkHTML();return}
  if(t.getAttribute("data-rp")){rpV[t.getAttribute("data-rp")]=t.value}
  if(t.getAttribute("data-ex")){EXV[Number(t.getAttribute("data-ex"))]=t.value}
});
lastHash=location.hash;
route();
</script>
